<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in - Forensic Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-bold mb-4">Sign in to Forensic Suite</h1>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="text-sm">Username</label>
        <input id="username" class="w-full border p-2 rounded mt-1" required />
      </div>
      <div>
        <label class="text-sm">Password</label>
        <input id="password" type="password" class="w-full border p-2 rounded mt-1" required />
      </div>
      <div class="flex items-center gap-3">
        <button id="signIn" class="flex-1 bg-indigo-600 text-white py-2 rounded">Sign in</button>
        <button id="register" type="button" class="flex-1 bg-gray-200 py-2 rounded">Register</button>
      </div>
      <p id="message" class="text-sm text-red-600 hidden"></p>
    </form>
  </div>

  <script>
    async function postJson(url, body) {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return res;
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const msg = document.getElementById('message');
      msg.classList.add('hidden');

      try {
        const res = await postJson('/api/login', { username: user, password: pass });
        if (!res.ok) { msg.textContent = 'Sign in failed'; msg.classList.remove('hidden'); return; }
        const data = await res.json();
        localStorage.setItem('sessionToken', data.token);
        localStorage.setItem('sessionUser', user);
        window.location.href = '/';
      } catch (e) {
        msg.textContent = 'Network error'; msg.classList.remove('hidden');
      }
    });

    document.getElementById('register').addEventListener('click', async () => {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const msg = document.getElementById('message');
      msg.classList.add('hidden');
      if (!user || !pass) { msg.textContent = 'Provide username and password'; msg.classList.remove('hidden'); return; }
      try {
        const res = await postJson('/api/register', { username: user, password: pass });
        if (!res.ok) { msg.textContent = 'Registration failed'; msg.classList.remove('hidden'); return; }
        msg.textContent = 'Registered. Now sign in.'; msg.classList.remove('hidden');
      } catch (e) { msg.textContent = 'Network error'; msg.classList.remove('hidden'); }
    });
  </script>
</body>
</html>
