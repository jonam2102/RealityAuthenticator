name: Docker Build & Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t authenticator-local:ci .

      - name: Run container
        run: |
          docker run -d --name authenticator-ci -p 3000:3000 \
            -v $GITHUB_WORKSPACE/db:/usr/src/app/db \
            -v $GITHUB_WORKSPACE/logs:/usr/src/app/logs \
            authenticator-local:ci

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/ >/dev/null; then echo ready && break; fi
            sleep 1
          done

      - name: Run smoke test
        env:
          SKIP_START: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run smoke-test

      - name: Stop container
        if: always()
        run: |
          docker rm -f authenticator-ci || true
