name: CI Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Start server
        run: nohup npm start > server.log 2>&1 &
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/ >/dev/null; then
              echo 'server ready'; exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run smoke test
        env:
          SKIP_START: 'true'
        run: npm run smoke-test
